name: Beta feedback
description: Share your experience trying the LocalBase private beta
title: "[beta] "
labels: ["beta-feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing LocalBase. Short answers are fine. Do not paste secrets or application data.
  - type: textarea
    id: built
    attributes:
      label: What were you trying to build?
    validations:
      required: true
  - type: input
    id: ttfr
    attributes:
      label: How long did it take to get the first API response?
      placeholder: e.g. 5 minutes, or "never got there"
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: What was the first confusing or broken step?
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: Which feature did you expect but could not find?
  - type: dropdown
    id: reuse
    attributes:
      label: Would you use LocalBase again for local development or an internal tool?
      options:
        - "Yes"
        - Maybe
        - "No"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: LocalBase version (`npx @localbase/cli --version`), Node version, and OS.
      placeholder: 0.1.0-beta.2, Node v22, Windows 11
    validations:
      required: true
