name: Bug report
description: Report a bug in LocalBase (CLI, core, SDK, or Admin Studio)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For **security** issues do not use this form; see the [security policy](https://github.com/reyanshdagoat9113/localbase/security/policy).
  - type: input
    id: version
    attributes:
      label: LocalBase version
      description: Output of `npx @localbase/cli --version`
      placeholder: 0.1.0-beta.2
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node -v`
      placeholder: v22.x
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package affected
      options:
        - cli
        - core
        - sdk
        - admin
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally from a clean directory.
      placeholder: |
        1. npx @localbase/cli init
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output or stack trace. Remove secrets and tokens.
      render: shell
  - type: textarea
    id: config
    attributes:
      label: localbase.config.ts (sanitized)
      description: Remove secrets, keys, and private data.
      render: ts
