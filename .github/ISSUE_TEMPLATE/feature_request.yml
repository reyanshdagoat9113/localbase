name: Feature request
description: Suggest an enhancement for LocalBase
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should LocalBase behave after the change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - CLI
        - Core / API
        - Auth / RLS
        - Realtime
        - Storage
        - Jobs
        - Admin Studio
        - SDK
        - Docs
        - Packaging / release
    validations:
      required: true
